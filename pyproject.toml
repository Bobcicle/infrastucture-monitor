[project]
name = "infrastructure-monitor"
version = "0.1.0"
description = "Infrastructure monitoring API"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psutil",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "alembic",
]